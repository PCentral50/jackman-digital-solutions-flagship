<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" width="600" height="1010" role="img" aria-labelledby="mobile-roadmap-title mobile-roadmap-desc">
<title id="mobile-roadmap-title">Four stages before live customer payments</title>
<desc id="mobile-roadmap-desc">Design, sandbox test, verify payments and orders, then obtain launch approval. Live payments are not available on the preview.</desc>
<rect width="600" height="1010" fill="#eff3e9"/>
<text x="32" y="54" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" letter-spacing="3" fill="#51745b">J. / PAYMENT ROADMAP</text>
<text x="32" y="113" font-family="Georgia, 'Times New Roman', serif" font-size="45" fill="#173a2a">Trust is built in stages.</text>
<text x="32" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536b59">Four steps before real checkout goes live.</text>
<path d="M 75 230 V 820" stroke="#b1c6af" stroke-width="5" stroke-dasharray="7 14"/>
<rect x="24" y="188" width="552" height="160" rx="18" fill="#fffcf5" stroke="#cfdbc9" stroke-width="2"/>
<circle cx="75" cy="238" r="30" fill="#1e4832"/>
<text x="75" y="248" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">01</text>
<text x="130" y="231" font-size="18" letter-spacing="2" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#607f64">DESIGN</text>
<text x="130" y="275" font-size="30" font-family="Georgia, 'Times New Roman', serif" fill="#193d2b">Preview the storefront</text>
<text x="130" y="308" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#53695b">No real payments or orders.</text>
<rect x="24" y="367" width="552" height="160" rx="18" fill="#fffcf5" stroke="#cfdbc9" stroke-width="2"/>
<circle cx="75" cy="417" r="30" fill="#1e4832"/>
<text x="75" y="427" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">02</text>
<text x="130" y="410" font-size="18" letter-spacing="2" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#607f64">SANDBOX</text>
<text x="130" y="454" font-size="30" font-family="Georgia, 'Times New Roman', serif" fill="#193d2b">Test the provider</text>
<text x="130" y="487" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#53695b">Use controlled sandbox transactions.</text>
<rect x="24" y="546" width="552" height="160" rx="18" fill="#fffcf5" stroke="#cfdbc9" stroke-width="2"/>
<circle cx="75" cy="596" r="30" fill="#1e4832"/>
<text x="75" y="606" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">03</text>
<text x="130" y="589" font-size="18" letter-spacing="2" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#607f64">VERIFY</text>
<text x="130" y="633" font-size="30" font-family="Georgia, 'Times New Roman', serif" fill="#193d2b">Confirm every order</text>
<text x="130" y="666" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#53695b">Secure notifications and amounts.</text>
<rect x="24" y="725" width="552" height="160" rx="18" fill="#193d2b" stroke="#193d2b" stroke-width="2"/>
<circle cx="75" cy="775" r="30" fill="#b9d4b9"/>
<text x="75" y="785" font-size="25" font-weight="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#193d2b">04</text>
<text x="130" y="768" font-size="18" letter-spacing="2" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#b6d2b3">APPROVE</text>
<text x="130" y="812" font-size="30" font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">Go live only with consent</text>
<text x="130" y="845" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#d4e5d0">Merchant approval and final testing.</text>
<rect x="24" y="913" width="552" height="67" rx="8" fill="#d9e6d4"/>
<text x="45" y="939" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1d432c">PREVIEW ONLY · NO LIVE PAYMENT GATEWAY</text>
<text x="45" y="963" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#496a50">Illustrative process, not a deployed checkout.</text>
</svg>